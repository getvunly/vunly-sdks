name: SDK tests

# Runs each SDK's own tests and the shared Retry-After vectors on GitHub-hosted runners.
# No secrets are used and none are needed: the tests use fake transports or local servers and synthetic keys.
#
# Actions are pinned to a full commit SHA; the tag each SHA was read from is in the comment after it. The SHAs were read on
# 2026-10-28 from the actions' repositories (the commit the tag points to, annotated tags dereferenced). To update one, read
# the tag again and replace both the SHA and the comment.
#
# Every `run` step uses bash with -e and -o pipefail, so `<test command> | tee` takes the status of the test command.
# Every job first checks that the toolchain it asked for is the one that is installed, and fails with a message that names
# the SDK, the expected version and the found version. There is no fallback to another version. Every job except Python then
# checks the log of its test step: no failure line, and a passing summary with at least one test. Python relies on pytest, which
# exits non-zero when a test fails or when it collects none. The vectors job compares files.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    name: Retry-After vectors are identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare the eight copies with the shared file
        run: |
          for f in typescript/test python/tests go/testdata java/src/test/resources dotnet/tests rust/tests php/tests ruby/test; do
            cmp "$f/retry-after-vectors.json" conformance/retry-after-vectors.json
          done

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check the toolchain
        run: |
          found="$(node --version)"
          case "$found" in
            v${{ matrix.node }}.*) echo "TypeScript: Node $found" ;;
            *) echo "::error::TypeScript: expected Node ${{ matrix.node }}, found $found"; exit 1 ;;
          esac
      - name: Test
        working-directory: typescript
        run: npm test 2>&1 | tee test.log
      - name: Check the test log
        working-directory: typescript
        run: |
          fail() { echo "::error::TypeScript: $1"; exit 1; }
          grep -Eq '^(# |ℹ )fail 0[[:space:]]*$' test.log || fail "the summary does not say fail 0"
          grep -Eq '^(# |ℹ )pass [1-9][0-9]*[[:space:]]*$' test.log || fail "the test step ran no passing test"
      - name: Type check and pack
        working-directory: typescript
        run: |
          npm install
          npm run typecheck
          npm run pack:local

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check the toolchain
        run: |
          found="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          [ "$found" = "${{ matrix.python }}" ] || { echo "::error::Python: expected ${{ matrix.python }}, found $found"; exit 1; }
          echo "Python: $found"
      - name: Test
        working-directory: python
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[test]"
          .venv/bin/python -m pytest

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - name: Check the toolchain
        run: |
          found="$(go version)"
          case "$found" in
            "go version go${{ matrix.go }}."*) echo "Go: $found" ;;
            *) echo "::error::Go: expected ${{ matrix.go }}, found $found"; exit 1 ;;
          esac
      - name: Test
        working-directory: go
        run: |
          go vet ./...
          go test -count=1 -v ./... 2>&1 | tee test.log
      - name: Check the test log
        working-directory: go
        run: |
          fail() { echo "::error::Go: $1"; exit 1; }
          if grep -Eq '^(--- FAIL|FAIL)' test.log; then fail "the test log has a failure"; fi
          grep -q '^--- PASS' test.log || fail "the test step ran no passing test"
          grep -Eq '^ok[[:space:]]' test.log || fail "no package reported ok"

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Check the toolchain
        run: |
          found="$(java -version 2>&1 | head -n 1)"
          case "$found" in
            *"\"${{ matrix.java }}\""* | *"\"${{ matrix.java }}."*) echo "Java: $found" ;;
            *) echo "::error::Java: expected ${{ matrix.java }}, found $found"; exit 1 ;;
          esac
      - name: Test
        working-directory: java
        run: mvn -B -ntp clean test 2>&1 | tee test.log
      - name: Check the test log
        working-directory: java
        run: |
          fail() { echo "::error::Java: $1"; exit 1; }
          if grep -q 'BUILD FAILURE' test.log; then fail "the build failed"; fi
          last="$(grep -E 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$' test.log | tail -n 1)"
          [ -n "$last" ] || fail "no Maven summary line"
          echo "$last" | grep -Eq 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0' || fail "the last summary is not a clean run of at least one test: $last"

  dotnet:
    name: .NET ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: "8.0.x"
            major: "8"
            tfm: net8.0
          - dotnet: "10.0.x"
            major: "10"
            tfm: net10.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Check the toolchain
        run: |
          dotnet --list-sdks | grep -Eq '^${{ matrix.major }}\.' || { echo "::error::.NET: expected an SDK ${{ matrix.major }}, found $(dotnet --list-sdks | tr '\n' ';')"; exit 1; }
          dotnet --list-runtimes | grep -Eq '^Microsoft\.NETCore\.App ${{ matrix.major }}\.' || { echo "::error::.NET: expected a runtime ${{ matrix.major }}, found $(dotnet --list-runtimes | tr '\n' ';')"; exit 1; }
          echo ".NET ${{ matrix.major }}: $(dotnet --list-sdks | grep -E '^${{ matrix.major }}\.')"
      - name: Test
        working-directory: dotnet/tests/Vunly.Tests
        run: dotnet test -f ${{ matrix.tfm }} -p:TargetFrameworks=${{ matrix.tfm }} 2>&1 | tee test.log
      - name: Check the test log
        working-directory: dotnet/tests/Vunly.Tests
        run: |
          fail() { echo "::error::.NET: $1"; exit 1; }
          if grep -Eq '^[[:space:]]*Failed!' test.log; then fail "the test log has a failed run"; fi
          grep -Eq '^[[:space:]]*Passed!.*Failed: +0, Passed: +[1-9][0-9]*' test.log || fail "no passing run of at least one test"

  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.1", "1.99.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Check the toolchain
        run: |
          found="$(cargo +${{ matrix.rust }} --version)"
          case "$found" in
            "cargo ${{ matrix.rust }} "*) echo "Rust: $found" ;;
            *) echo "::error::Rust: expected ${{ matrix.rust }}, found $found"; exit 1 ;;
          esac
      - name: Test
        working-directory: rust
        run: cargo +${{ matrix.rust }} test --locked 2>&1 | tee test.log
      - name: Check the test log
        working-directory: rust
        run: |
          fail() { echo "::error::Rust: $1"; exit 1; }
          if grep -Eq 'test result: FAILED|error: test failed|error: could not compile' test.log; then fail "the test log has a failure"; fi
          if grep 'test result:' test.log | grep -v 'test result: ok\.' > /dev/null; then fail "a test result line is not ok"; fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' test.log || fail "the test step ran no passing test"

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - name: Check the toolchain
        run: |
          found="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
          [ "$found" = "${{ matrix.php }}" ] || { echo "::error::PHP: expected ${{ matrix.php }}, found $found"; exit 1; }
          echo "PHP: $found"
      - name: Test
        working-directory: php
        run: |
          composer update --no-interaction --no-progress
          vendor/bin/phpunit --no-progress 2>&1 | tee test.log
      - name: Check the test log
        working-directory: php
        run: |
          fail() { echo "::error::PHP: $1"; exit 1; }
          if grep -Eq '^(FAILURES!|ERRORS!)' test.log; then fail "the test log has a failure"; fi
          grep -Eq '^OK \([1-9][0-9]* tests?' test.log || fail "no clean run of at least one test"

  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0, the v1 branch when the SHA was read
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Check the toolchain
        run: |
          found="$(ruby -e 'puts RUBY_VERSION')"
          case "$found" in
            ${{ matrix.ruby }}.*) echo "Ruby: $found" ;;
            *) echo "::error::Ruby: expected ${{ matrix.ruby }}, found $found"; exit 1 ;;
          esac
      - name: Test
        working-directory: ruby
        run: ruby -Ilib -Itest -e 'Dir["test/*_test.rb"].sort.each { |f| require "./#{f}" }' 2>&1 | tee test.log
      - name: Check the test log
        working-directory: ruby
        run: |
          fail() { echo "::error::Ruby: $1"; exit 1; }
          if grep -E '[0-9]+ runs,' test.log | grep -Ev ' 0 failures, 0 errors' > /dev/null; then fail "a summary line has a failure or an error"; fi
          grep -Eq '[1-9][0-9]* runs, [0-9]+ assertions, 0 failures, 0 errors' test.log || fail "no clean run of at least one test"
