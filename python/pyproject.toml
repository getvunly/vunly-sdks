[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vunly"
version = "0.1.1"
description = "Vunly client for Python: usage-based billing for AI products. Sandbox only. Sync and async, typed, retries only what is safe."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/getvunly/vunly-sdks"
Repository = "https://github.com/getvunly/vunly-sdks/tree/main/python"
Issues = "https://github.com/getvunly/vunly-sdks/issues"

[project.scripts]
vunly = "vunly.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vunly = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
